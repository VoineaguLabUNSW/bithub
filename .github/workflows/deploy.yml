name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  # Manual trigger. Without this the only way to rebuild after changing
  # CHAT_API_URL is "Re-run all jobs" on an old run, which reuses the original
  # commit and actor — a fresh dispatch is unambiguous.
  workflow_dispatch:

jobs:
  build_site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Report which source supplied the chat URL. The build no longer depends
      # on the repository variable, so an empty vars.* is informational rather
      # than a failure — but it is still worth printing, because it is the only
      # place the distinction is visible: vars.* renders empty (not an error)
      # when the variable is missing, is a secret rather than a variable, or is
      # scoped to an environment this job does not declare.
      - name: Report chat config source
        run: |
          if [ -n "${{ vars.CHAT_API_URL }}" ]; then
            echo "Using repository variable CHAT_API_URL: ${{ vars.CHAT_API_URL }}"
          else
            echo "CHAT_API_URL is empty as seen by this job; using the committed"
            echo "default in the build step. To override it, add CHAT_API_URL"
            echo "under Settings -> Secrets and variables -> Actions ->"
            echo "Variables, at REPOSITORY level (this job declares no"
            echo "'environment:', so environment-scoped variables are invisible)."
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          # Vite inlines these at BUILD time — they are not runtime config, so
          # changing the App Runner URL requires re-running this workflow.
          #
          # Set CHAT_API_URL under Settings -> Secrets and variables -> Actions
          # -> Variables to the App Runner service URL, scheme and host only:
          #     https://xxxxxxxx.ap-southeast-2.awsapprunner.com
          # A trailing slash or a path breaks the fetch and the CORS match.
          #
          # It is a variable rather than a secret because the URL is public the
          # moment the site calls it, and secrets are masked in build logs.
          #
          # The literal is the committed DEFAULT, with the repository variable
          # as an override. Deriving this from the variable alone failed three
          # builds in a row: `vars.X` renders an empty string — not an error —
          # when the variable is missing, is a secret rather than a variable, or
          # is scoped to an environment this job does not declare. All three are
          # indistinguishable in the built bundle, and each one silently
          # compiled the chat link out while the deploy reported success.
          # Committing the URL removes that whole class of failure: the site is
          # public and so is this hostname, so there is nothing to protect here.
          # To repoint the chat, set CHAT_API_URL (it wins) or edit this line.
          VITE_CHAT_API: ${{ vars.CHAT_API_URL || 'https://ecqhnavk6e.ap-southeast-2.awsapprunner.com' }}
          # Unconditionally true now that the URL above always has a value.
          # This was previously gated on the variable being set, to avoid
          # shipping a link to a backend that does not exist — a real risk when
          # the URL came only from repository config. With the default committed
          # the link can always reach a live service, so the gate is dead weight
          # and was in fact the thing hiding the button. config.js compares
          # against the STRING 'true', hence the quotes.
          VITE_SHOW_CHAT: 'true'
        run: |
          bun run build

      # Fail loudly if the gate did not make it into the bundle. Without this
      # the deploy succeeds and the missing button looks like a frontend bug.
      #
      # No `if:` guard — the previous version only ran this when the variable
      # was non-empty, so in exactly the case that was broken it was skipped.
      # The URL now always has a value, so this must always hold.
      - name: Verify chat gate was inlined
        run: |
          if ! grep -rq "awsapprunner" build/_app/immutable/chunks/; then
            echo "The chat backend URL did not reach the bundle." >&2
            exit 1
          fi
          # SHOW_CHAT must compile to true (minified !0), otherwise the link is
          # dropped even though the URL is present — the exact failure that
          # shipped three times. Match `=!1;export` rather than a specific
          # minified name: the identifier is rollup-assigned and changes between
          # builds, so pinning it would make this check silently stop working.
          if grep -rq '=!1;export' build/_app/immutable/chunks/config.*.js; then
            echo "SHOW_CHAT compiled to false: the chat link will not render." >&2
            exit 1
          fi
          echo "chat URL inlined and SHOW_CHAT is true"

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/build'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
