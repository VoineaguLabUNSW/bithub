name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

jobs:
  build_site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          # Vite inlines these at BUILD time — they are not runtime config, so
          # changing the App Runner URL requires re-running this workflow.
          #
          # Set CHAT_API_URL under Settings -> Secrets and variables -> Actions
          # -> Variables to the App Runner service URL, scheme and host only:
          #     https://xxxxxxxx.ap-southeast-2.awsapprunner.com
          # A trailing slash or a path breaks the fetch and the CORS match.
          #
          # It is a variable rather than a secret because the URL is public the
          # moment the site calls it, and secrets are masked in build logs.
          VITE_CHAT_API: ${{ vars.CHAT_API_URL }}
          # Gate the chat link on the URL being set. Without this the link can
          # ship pointing at github.io/api/chat, which 404s — a visible feature
          # that cannot work is worse than a hidden one. Renders 'true'/'false',
          # which is what config.js compares against.
          VITE_SHOW_CHAT: ${{ vars.CHAT_API_URL != '' }}
        run: |
          bun run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/build'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4