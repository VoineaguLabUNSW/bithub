output_resources: "./output" 
output_external: "./output" 

# Annotation files
ncbi_gene_info: "./annotations/Homo_sapiens.gene_info.gz"
ncbi_gtf: "./annotations/Homo_sapiens.GRCh38.109.gtf.gz"
genenames_alias: "./annotations/genenames.tsv" #https://www.genenames.org/cgi-bin/download/custom?col=gd_hgnc_id&col=gd_app_sym&col=gd_status&col=gd_prev_sym&col=gd_aliases&col=gd_pub_ensembl_id&status=Approved&status=Entry%20Withdrawn&hgnc_dbtag=on&order_by=gd_app_sym_sort&format=text&submit=submit

# If not deploying local, must e.g. aws sso login --profile .., export AWS_PROFILE=...
deploy_local: True
deploy_only: False
deploy_url: "d33ldq8s2ek4w8.cloudfront.net"
deploy_bucket: "bithub-bucket"

datasets:

    # ---------------- Bulk RNA-seq ----------------

    -   id: BrainSeq
        url: "https://eqtl.brainseq.org/phase2/"
        dir: "../data-preprocessing/output/BrainSeq"
        meta: "BrainSeq-metadata.csv"
        annot: "BrainSeq-annot-final.csv"       # 33 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: RPKM
                path: "BrainSeq-exp.csv"
        variancePartition: "BrainSeq_varPart.csv"
        transcript_matrices:
            -   name: "HIP Age Interval"
                path: "BrainSeq-hip-exp.csv"
                variable: "Age Interval"
            -   name: "PFC Age Interval"
                path: "BrainSeq-pfc-exp.csv"
                variable: "Age Interval"
        # export from BrainSeq.Rda
        # transcript_matrices omitted: BrainSeq-tx-hip-exp.csv / -pfc- are declared
        # in the committed config but produced by no notebook and absent from
        # CloudFront. Re-add only if you actually have them.

    -   id: BrainSpan
        url: "https://www.brainspan.org/static/download.html"
        dir: "../data-preprocessing/output/BrainSpan"
        meta: "BrainSpan-metadata.csv"
        annot: "BrainSpan-annot-final.csv"      # 19 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: RPKM
                path: "BrainSpan-exp.csv"
        variancePartition: "BrainSpan_varPart.csv" # already exists as CSV

    -   id: GTEx
        url: "https://gtexportal.org/home/datasets"
        dir: "../data-preprocessing/output/GTEx"
        meta: "GTEx-metadata.csv"
        annot: "GTEx-annot-final.csv"           # 50 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: TPM
                path: "GTEx-exp.csv"
        variancePartition: "GTEx_varPart.csv"
        transcript_matrices:
            -   name: "All tissues"
                path: "GTEx-tx-exp.csv"      # export from GTEx.Rda

    -   id: HDBR
        url: "https://www.hdbr.org/"
        dir: "../data-preprocessing/output/HDBR"
        meta: "HDBR-metadata.csv"
        annot: "HDBR-annot-final.csv"           # 42 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: RPKM
                path: "HDBR-exp.csv"
        variancePartition: "HDBR_varPart.csv"      # export from HDBR.Rda (NOT HDBR-2.Rda)

    -   id: PsychENCODE
        url: "http://resource.psychencode.org"
        dir: "../data-preprocessing/output/PsychENCODE"
        meta: "PsychEncode-metadata.csv"           # note: file is "PsychEncode", id is "PsychENCODE"
        annot: "PE-annot-final.csv"    # 43 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: TPM
                path: "PsychEncode-exp.csv"
        variancePartition: "PsychENCODE_varPart.csv"  # export from PsychENCODE.Rda

    # ---------------- Single-nucleus ----------------
    # No variancePartition for these — variance partitioning was run on the
    # bulk datasets only.

    -   id: HCA
        url: "https://www.humancellatlas.org/"
        dir: "../data-preprocessing/output/HCA"
        meta: "HCA-metadata.csv"            # live build used the -subset file (46,958),
                                                               # not HCA-metadata.csv (47,194). Confirm which.
        annot: "HCA-annot.csv"                     # 16 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: CPM
                path: "HCA-exp.csv"

    -   id: Velmeshev
        url: "https://cells.ucsc.edu/?ds=autism"
        dir: "../data-preprocessing/output/Velmeshev"
        meta: "Velmeshev-metadata.csv"
        annot: "Velmeshev-annot.csv"               # 18 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: CPM
                path: "Velmeshev-exp.csv"

    -   id: Cameron
        url: "https://www.biologicalpsychiatryjournal.com/article/S0006-3223(22)01404-4/fulltext"
        dir: "../data-preprocessing/output/Cameron"
        meta: "Cameron-metadata.csv"
        annot: "Cameron-metadata-annot.csv"        # 12 columns marked Yes
        customFilter:
                name: "Brain Region"
                column: "Regions"
        matrices:
            -   name: CPM
                path: "Cameron-exp.csv"
                # NOT output/metadata/Cameron-exp.csv — that file is misnamed,
                # it is a 69,284 x 10 cell metadata table, not a matrix.


# ---------------------------------------------------------------------------
# Category ordering
# ---------------------------------------------------------------------------


customMetadataCategoryOrders:
    -   variable: "Age Interval"
        datasets: [BrainSeq, BrainSpan, GTEx, HDBR, PsychENCODE, HCA, Velmeshev, Cameron]
        order: ["4-7pcw", "8-9pcw", "10-12pcw", "13-15pcw", "16-18pcw", "19-24pcw", "25-38pcw", "0-5mos", "6-18mos", "19mos-5yrs", "6-11yrs", "12-19yrs", "20-29yrs", "30-39yrs", "40-49yrs", "50-59yrs", "60-69yrs", "70-79yrs", "80-89yrs", "90-99yrs"]
        groups:
            -   label: prenatal
                size: 7
            -   label: postnatal
                size: 13

    -   variable: "Period"
        datasets: [BrainSeq, BrainSpan, GTEx, HDBR, PsychENCODE]
        order: ["Prenatal", "Postnatal"]
    
    -   variable: "Regions"
        datasets: [BrainSeq, BrainSpan, GTEx, HDBR, PsychENCODE, HCA, Velmeshev, Cameron]
        order:  ["Cortex", "Subcortex", "Cerebellum", "Spinal Cord",
                 "Forebrain", "Midbrain", "Hindbrain", "Brain", "Chroid plexus"]
        color:  ["#e6194b", "#3cb44b", "#ffe119", "#4363d8",
                 "#f58231", "#911eb4", "#46f0f0", "#f032e6", "#bcf60c"]





groups:
    -   id: "Bulk"
        datasets: [BrainSeq, BrainSpan, GTEx, HDBR, PsychENCODE]
    -   id: "SingleCell"
        datasets: [HCA, Velmeshev, Cameron]

